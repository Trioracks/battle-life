name: Public preview

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.revision.outputs.sha }}
    env:
      BATTLE_PYTHON: python3
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      npm_config_cache: ${{ runner.temp }}/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
      AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout exact public revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up test-only Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify revision and record release SHA
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AUDIT_HEAD"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Install locked development tools
        run: npm ci
      - name: Public tests
        run: npm test
      - name: Audit source and new history
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:source > "$RUNNER_TEMP/source-audit.json"
          base="$AUDIT_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('docs/public-source-provenance.json')).publicBase)")"
          fi
          base="$(git merge-base "$base" "$AUDIT_HEAD")"
          node tools/audit-publication.mjs history --base "$base" --head "$AUDIT_HEAD" > "$RUNNER_TEMP/history-audit.json"
      - name: Build public runtime
        run: npm run build:preview
      - name: Audit built runtime
        run: npm run audit:site > "$RUNNER_TEMP/site-audit.json"
      - name: Install Chromium on the hosted runner
        run: npx playwright install --with-deps chromium
      - name: Browser smoke against the isolated built artifact
        run: npm run qa:preview -- --root dist/public-preview --output-dir "$RUNNER_TEMP/public-preview-qa"
      - name: Upload audited Pages runtime
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/public-preview

  deploy:
    if: ${{ needs['checks-build'].result == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: checks-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-publication
      queue: max
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      release_sha: ${{ needs['checks-build'].outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ needs['checks-build'].outputs.release_sha }}
    steps:
      - name: Configure existing Pages source
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Keep active and pending publications when a slow older build arrives.
      # Queue admission order can differ from commit order; check master last.
      - name: Reject stale master immediately before publication
        id: current-master
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          current="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/master)"
          current="${current%%[[:space:]]*}"
          if [[ ! "$current" =~ ^[a-f0-9]{40}$ || "$current" != "$RELEASE_SHA" ]]; then
            echo 'Refusing to deploy: this build is no longer current master.' >&2
            exit 1
          fi
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record published URL and revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Preview: %s\n\nRelease SHA: `%s`\n' "$PAGE_URL" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
