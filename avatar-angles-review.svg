<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title description">
  <title id="title">Battle Life — модель персонажа в четырёх ракурсах</title>
  <desc id="description">Лист для визуальных правок: анфас, правый профиль, вид со спины и левый профиль.</desc>
  <defs>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 2h8" stroke="#d6d9cc" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="7" dy="9" stdDeviation="3" flood-color="#060b0b" flood-opacity=".55"/></filter>
    <style>
      .label{font:700 24px Arial,sans-serif;letter-spacing:2px;fill:#f3ead4}.caption{font:600 15px Arial,sans-serif;letter-spacing:1.5px;fill:#d7aa52}.note{font:15px Arial,sans-serif;fill:#b7c1b8}.panel{fill:#172725;stroke:#c9a94b;stroke-opacity:.55;stroke-width:2}.floor{fill:#263733}.skin{fill:#a96f4d}.skinlight{fill:#c28764}.hair{fill:#1d1716}.eye{fill:#e8e8d7}.brow{fill:#332221}.mouth{fill:#884443}.jacket{fill:#203d42}.jacketlight{fill:#31595c}.pants{fill:#586047}.shoe{fill:#d8d6bd}.outline{stroke:#101918;stroke-width:5;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#0f1d1b"/>
  <rect width="1280" height="820" fill="url(#scan)"/>
  <text x="56" y="62" class="caption">BATTLE LIFE / ПРОВЕРКА МОДЕЛИ</text>
